name: Build ESP32-S3 Chatbot Firmware

# 触发条件：
# 1. 推送到 main/master 分支   -> 编译 + 滚动预览 Release（latest-ci，prerelease）
# 2. 创建 release 标签 (v*)    -> 编译 + 正式 Release（以 tag 为版本号）
# 3. 手动触发 (workflow_dispatch) -> 只编译；勾选 publish_release 才发布预览 Release
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      publish_release:
        description: '构建成功后发布到 Releases（滚动预览版 latest-ci）'
        type: boolean
        default: false

# 并发控制：同一分支只保留最新构建
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ============================================================
# 安全说明：
# - 火山方舟 API Key 不编译进固件（sdkconfig 中被忽略，宏为空占位），
#   由设备首次启动后通过配网页 (192.168.4.1) 输入并存入 NVS
# - WiFi 密码不编译进固件，由配网页输入后存储到 NVS
# - BOOT 键重配网只擦除 WiFi 配置，保留 Agent Key
# - sdkconfig 已在 .gitignore 中，不会提交；云编译由 sdkconfig.defaults 生成
#   （defaults 含 TLS record buffer 关键修复，勿删除）
# ============================================================

jobs:
  build:
    runs-on: ubuntu-latest
    # 输出供 release 作业使用（artifact 名称依赖 commit_sha）
    outputs:
      commit_sha: ${{ steps.version.outputs.commit_sha }}
      commit_date: ${{ steps.version.outputs.commit_date }}
      branch: ${{ steps.version.outputs.branch }}
    container:
      image: espressif/idf:v5.3.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # vendor/ 为仓库内 monorepo 源码（含 LOCAL FIX），无子模块
          submodules: false
          fetch-depth: 0

      - name: Remove stale dependencies.lock
        run: |
          # LOCAL FIX (2026-11-04): 本地生成的 dependencies.lock 含 Windows 绝对路径
          # (source.path: D:\esp32s3_chatbot\vendor\..., type: local)，Linux 云端无法
          # 解析导致组件丢失（曾表现为 app_main 链接失败）。删除后组件管理器按
          # main/idf_component.yml 的相对 override_path 重新生成。
          rm -f "$GITHUB_WORKSPACE/dependencies.lock"
          ls -la "$GITHUB_WORKSPACE" | grep -E 'dependencies|vendor' || true

      - name: Get version info
        id: version
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          echo "commit_sha=$(git rev-parse --short HEAD || echo unknown)" >> $GITHUB_OUTPUT
          echo "commit_date=$(git log -1 --format=%cd --date=short || echo unknown)" >> $GITHUB_OUTPUT
          echo "branch=$(git rev-parse --abbrev-ref HEAD || echo unknown)" >> $GITHUB_OUTPUT

      - name: Prepare sdkconfig
        run: |
          cd "$GITHUB_WORKSPACE"
          # 从 defaults 生成 sdkconfig（含全部 LOCAL FIX 关键配置）
          cp sdkconfig.defaults sdkconfig

          # Agent 编译期宏置空：main.cpp 在宏为空时自动补默认
          #   model = "1.2.6.1" (Seed-1.2.6.1)
          #   voice = "zh_female_vv_uranus_bigtts" (Vivi 2.0)
          # API Key 留空——首次启动后通过配网页输入真实值存 NVS
          cat >> sdkconfig << 'EOF'
          CONFIG_EXAMPLE_AGENTS_OPENAI_API_KEY=""
          CONFIG_EXAMPLE_AGENTS_OPENAI_MODEL=""
          CONFIG_EXAMPLE_AGENTS_OPENAI_VOICE=""
          CONFIG_EXAMPLE_AGENTS_OPENAI_APP_ID=""
          EOF

          # 确保 sdkconfig 不会被意外提交
          echo "sdkconfig" >> .git/info/exclude

          echo "sdkconfig prepared with placeholder values"

      - name: Diagnose component manager
        run: |
          . $IDF_PATH/export.sh
          echo "=== idf-component-manager version ==="
          python -m pip show idf-component-manager 2>&1 | grep -E "^(Name|Version)" || true
          python -m pip show idf-component-tools 2>&1 | grep -E "^(Name|Version)" || true
          idf.py --version
          echo "IDF_PATH=$IDF_PATH"

      - name: Build firmware
        # LOCAL FIX (2026-11-05): 必须用 bash——容器默认 sh 是 dash，
        # `set -o pipefail` 在 dash 下报 Illegal option 直接 exit 2，idf.py 根本没跑；
        # 同时去掉 continue-on-error，编译真失败时 run 显红而不是假绿
        shell: bash
        run: |
          # 消除 git dubious ownership 警告（使 PROJECT_VER 正常）
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # 加载 ESP-IDF 环境
          . $IDF_PATH/export.sh

          # LOCAL FIX (2026-11-05): registry 拉取的新版组件 manifest 含 $CONFIG{...} 条件依赖，
          # idf-component-manager 需要 CONFIG 环境变量指向 sdkconfig 才能解析（否则报
          # 'Environment variable "CONFIG" is not set'）
          export CONFIG="$GITHUB_WORKSPACE/sdkconfig"

          cd "$GITHUB_WORKSPACE"
          # 完整日志落盘，失败也可诊断（pipefail 保证退出码不被 tee 吞掉）
          set -o pipefail
          idf.py build 2>&1 | tee /tmp/build.log

          # 验证固件产出
          echo "=== build outputs ==="
          ls -la build/*.bin build/*.elf build/bootloader/*.bin build/partition_table/*.bin build/flash_args 2>&1 || echo "!! 固件文件缺失 !!"

          # 生成固件版本信息
          echo "Firmware Version: ${{ steps.version.outputs.commit_date }}-${{ steps.version.outputs.commit_sha }}" > build/version.txt
          echo "Branch: ${{ steps.version.outputs.branch }}" >> build/version.txt
          echo "Commit: ${{ github.sha }}" >> build/version.txt
          echo "" >> build/version.txt
          echo "API Key 未编译进固件，请首次启动后访问 192.168.4.1 配网页输入火山方舟 API Key" >> build/version.txt

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ steps.version.outputs.commit_sha }}
          path: /tmp/build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3_chatbot-firmware-${{ steps.version.outputs.commit_sha }}
          path: |
            build/esp32s3_chatbot.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flash_args
            build/esp32s3_chatbot.elf
            build/version.txt
            partitions.csv
            sdkconfig.defaults
            docs/WIRING.md
            docs/DISPLAY.md
          if-no-files-found: error
          retention-days: 30

      - name: Generate flash instructions
        continue-on-error: true
        run: |
          cd "$GITHUB_WORKSPACE"
          ls -la build/ | head -20 || true
          cat > build/FLASH_README.md <<'FLASH_EOF'
          # 固件刷写与配置说明

          ## 重要：API Key 配置

          **固件不包含火山方舟 API Key**，首次启动后需通过配网页输入：

          1. 刷写固件并上电
          2. 手机连接设备热点（如 `ESP-AP-XXXX`，无密码）
          3. 浏览器访问: `192.168.4.1`
          4. 在"豆包 Agent 配置"区域输入：
             - **API Key**: 火山方舟控制台获取（UUID 格式，如 `xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx`）
             - **Model**: 留空则默认 `1.2.6.1` (Seed-1.2.6.1)
             - **Voice**: 留空则默认 `zh_female_vv_uranus_bigtts` (Vivi 2.0)
          5. 点击"保存 Agent 配置"
          6. 配置 WiFi 并连接

          ## 重新配网（保留 Key）

          如需更换 WiFi 但保留已配置的 Agent Key：
          - **按住 BOOT 键 2 秒** → 设备重启进入配网模式
          - Key 已保存，无需重新输入
          - 只需重新配置 WiFi 即可

          ## 按键功能

          | 按键 | GPIO | 功能 |
          |------|------|------|
          | PTT | GPIO38 | 按住说话，松开停止 |
          | SWITCH | GPIO21 | 短按切换 AI Agent（小智 / 豆包） |
          | BOOT | GPIO0 | 按住 2 秒清除 WiFi 配置并重新配网（保留 Key） |

          ## 分区偏移

          | 文件 | 偏移地址 |
          |------|---------|
          | bootloader.bin | 0x0 |
          | partition-table.bin | 0x8000 |
          | esp32s3_chatbot.bin | 0x10000 |

          ## 完整刷写（首次）

          ```bash
          esptool.py --port COM4 --baud 921600 write_flash \
            0x0 bootloader.bin \
            0x8000 partition-table.bin \
            0x10000 esp32s3_chatbot.bin
          ```

          ## 仅更新 App（保留 NVS 配置）

          ```bash
          esptool.py --port COM4 --baud 921600 write_flash 0x10000 esp32s3_chatbot.bin
          ```
          FLASH_EOF

      - name: Upload flash instructions
        uses: actions/upload-artifact@v4
        with:
          name: flash-instructions
          path: build/FLASH_README.md
          retention-days: 30


  # ============================================================
  # 发布到 GitHub Releases
  # - push tag (v*)            -> 正式 Release，以 tag 为版本号，make_latest
  # - push main/master         -> 滚动预览 Release（tag: latest-ci，prerelease，资产每次覆盖）
  # - workflow_dispatch 勾选   -> 同上预览 Release
  # 注意：必须显式声明 permissions: contents: write，
  #       否则 GITHUB_TOKEN 默认只读，创建 Release 会 403
  # ============================================================
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # 资产名固定（预览版名字不带 commit sha），否则每次构建都会新增一份历史 zip
    env:
      BUNDLE_NAME: ${{ startsWith(github.ref, 'refs/tags/') && format('esp32s3_chatbot-firmware-{0}.zip', github.ref_name) || 'esp32s3_chatbot-firmware-latest-ci.zip' }}
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true')

    steps:
      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          # 按 build 作业输出的确切名称取，避免 pattern/merge-multiple 取错版本
          name: esp32s3_chatbot-firmware-${{ needs.build.outputs.commit_sha }}

      - name: Download flash instructions
        uses: actions/download-artifact@v4
        with:
          name: flash-instructions

      - name: Package release assets
        shell: bash
        run: |
          set -e
          bundle="${{ env.BUNDLE_NAME }}"
          mkdir -p dist
          # LOCAL FIX (2026-11-05): upload-artifact v4 会保留各 path 相对公共祖先的目录结构，
          # 下载后固件实际在 build/ 子目录下，因此用 find 定位，不写死路径
          find_first() { find . -type f -name "$1" -print -quit; }
          bin=$(find_first esp32s3_chatbot.bin)
          bl=$(find_first bootloader.bin)
          pt=$(find_first partition-table.bin)
          fa=$(find_first flash_args)
          if [ -z "$bin" ] || [ -z "$bl" ] || [ -z "$pt" ] || [ -z "$fa" ]; then
            echo "::error::固件工件文件未找到"
            ls -R .
            exit 1
          fi
          cp "$bin" dist/esp32s3_chatbot.bin
          cp "$bl" dist/bootloader.bin
          cp "$pt" dist/partition-table.bin
          cp "$fa" dist/flash_args
          # 工作区根目录再放一份 app 镜像，供 Release 单独挂资产（只刷 0x10000 时用）
          cp "$bin" ./esp32s3_chatbot.bin
          vt=$(find_first version.txt); [ -n "$vt" ] && cp "$vt" dist/ || true
          # FLASH_README.md 来自 flash-instructions 工件；缺失时降级为占位说明
          fr=$(find_first FLASH_README.md)
          if [ -n "$fr" ]; then
            cp "$fr" dist/FLASH_README.md
          else
            echo "# 刷写说明缺失（build 作业未产出 FLASH_README.md）" > FLASH_README.md
            fr=./FLASH_README.md
          fi
          {
            echo "## ESP32-S3 Chatbot 固件"
            echo
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Branch: ${{ needs.build.outputs.branch }}"
            echo
            echo "下载 \`$bundle\` 解压后即为完整刷写材料（bootloader/partition/app/flash_args）"
            echo "注：flash_args 里的路径是 build 目录相对路径，手动刷写请按下方分区偏移"
            echo "已配过网的用户只需刷 app 分区：0x10000 esp32s3_chatbot.bin（保留 WiFi 与 Agent Key）"
            echo
            cat "$fr"
          } > RELEASE_NOTES.md
          (cd dist && zip -qr "../$bundle" .)
          ls -la dist
          echo "bundle=$bundle"
          head -20 RELEASE_NOTES.md

      - name: Publish versioned Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ESP32-S3 Chatbot ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            ${{ env.BUNDLE_NAME }}
            esp32s3_chatbot.bin

      - name: Publish rolling preview Release (on main / manual)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          # 固定 tag：每次构建都更新同一条预览 Release，资产覆盖不堆积
          # （tag 已存在时 action 不会移动它，仅创建时指向本次 commit；资产与正文始终是当前构建）
          tag_name: latest-ci
          target_commitish: ${{ github.sha }}
          name: ESP32-S3 Chatbot CI 预览固件
          prerelease: true
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          # v2 默认 true；显式写出以便预览版反复覆盖同名资产
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            ${{ env.BUNDLE_NAME }}
            esp32s3_chatbot.bin
