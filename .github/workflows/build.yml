name: Build ESP32-S3 Chatbot Firmware

# 触发条件：
# 1. 推送到 main/master 分支
# 2. 创建 release 标签 (v*)
# 3. 手动触发 (workflow_dispatch)
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# 并发控制：同一分支只保留最新构建
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ============================================================
# 安全说明：
# - 火山方舟 API Key 不编译进固件（sdkconfig 中被忽略，宏为空占位），
#   由设备首次启动后通过配网页 (192.168.4.1) 输入并存入 NVS
# - WiFi 密码不编译进固件，由配网页输入后存储到 NVS
# - BOOT 键重配网只擦除 WiFi 配置，保留 Agent Key
# - sdkconfig 已在 .gitignore 中，不会提交；云编译由 sdkconfig.defaults 生成
#   （defaults 含 TLS record buffer 关键修复，勿删除）
# ============================================================

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.3.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # vendor/ 为仓库内 monorepo 源码（含 LOCAL FIX），无子模块
          submodules: false
          fetch-depth: 0

      - name: Remove stale dependencies.lock
        run: |
          # LOCAL FIX (2026-11-04): 本地生成的 dependencies.lock 含 Windows 绝对路径
          # (source.path: D:\esp32s3_chatbot\vendor\..., type: local)，Linux 云端无法
          # 解析导致组件丢失（曾表现为 app_main 链接失败）。删除后组件管理器按
          # main/idf_component.yml 的相对 override_path 重新生成。
          rm -f "$GITHUB_WORKSPACE/dependencies.lock"
          ls -la "$GITHUB_WORKSPACE" | grep -E 'dependencies|vendor' || true

      - name: Get version info
        id: version
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          echo "commit_sha=$(git rev-parse --short HEAD || echo unknown)" >> $GITHUB_OUTPUT
          echo "commit_date=$(git log -1 --format=%cd --date=short || echo unknown)" >> $GITHUB_OUTPUT
          echo "branch=$(git rev-parse --abbrev-ref HEAD || echo unknown)" >> $GITHUB_OUTPUT

      - name: Prepare sdkconfig
        run: |
          cd "$GITHUB_WORKSPACE"
          # 从 defaults 生成 sdkconfig（含全部 LOCAL FIX 关键配置）
          cp sdkconfig.defaults sdkconfig

          # Agent 编译期宏置空：main.cpp 在宏为空时自动补默认
          #   model = "1.2.6.1" (Seed-1.2.6.1)
          #   voice = "zh_female_vv_uranus_bigtts" (Vivi 2.0)
          # API Key 留空——首次启动后通过配网页输入真实值存 NVS
          cat >> sdkconfig << 'EOF'
          CONFIG_EXAMPLE_AGENTS_OPENAI_API_KEY=""
          CONFIG_EXAMPLE_AGENTS_OPENAI_MODEL=""
          CONFIG_EXAMPLE_AGENTS_OPENAI_VOICE=""
          CONFIG_EXAMPLE_AGENTS_OPENAI_APP_ID=""
          EOF

          # 确保 sdkconfig 不会被意外提交
          echo "sdkconfig" >> .git/info/exclude

          echo "sdkconfig prepared with placeholder values"

      - name: Diagnose component manager
        run: |
          . $IDF_PATH/export.sh
          echo "=== idf-component-manager version ==="
          python -m pip show idf-component-manager 2>&1 | grep -E "^(Name|Version)" || true
          python -m pip show idf-component-tools 2>&1 | grep -E "^(Name|Version)" || true
          idf.py --version
          echo "IDF_PATH=$IDF_PATH"

      - name: Build firmware
        continue-on-error: true
        run: |
          # 消除 git dubious ownership 警告（使 PROJECT_VER 正常）
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # 加载 ESP-IDF 环境
          . $IDF_PATH/export.sh

          cd "$GITHUB_WORKSPACE"
          # 完整日志落盘，失败也可诊断（pipefail 保证退出码不被 tee 吞掉）
          set -o pipefail
          idf.py build 2>&1 | tee /tmp/build.log

          # 验证固件产出
          echo "=== build outputs ==="
          ls -la build/*.bin build/*.elf build/bootloader/*.bin build/partition_table/*.bin build/flash_args 2>&1 || echo "!! 固件文件缺失 !!"

          # 生成固件版本信息
          echo "Firmware Version: ${{ steps.version.outputs.commit_date }}-${{ steps.version.outputs.commit_sha }}" > build/version.txt
          echo "Branch: ${{ steps.version.outputs.branch }}" >> build/version.txt
          echo "Commit: ${{ github.sha }}" >> build/version.txt
          echo "" >> build/version.txt
          echo "API Key 未编译进固件，请首次启动后访问 192.168.4.1 配网页输入火山方舟 API Key" >> build/version.txt

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ steps.version.outputs.commit_sha }}
          path: /tmp/build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3_chatbot-firmware-${{ steps.version.outputs.commit_sha }}
          path: |
            build/esp32s3_chatbot.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flash_args
            build/esp32s3_chatbot.elf
            build/version.txt
            partitions.csv
            sdkconfig.defaults
            docs/WIRING.md
            docs/DISPLAY.md
          if-no-files-found: error
          retention-days: 30

      - name: Generate flash instructions
        continue-on-error: true
        run: |
          cd "$GITHUB_WORKSPACE"
          ls -la build/ | head -20 || true
          cat > build/FLASH_README.md <<'FLASH_EOF'
# 固件刷写与配置说明

## 重要：API Key 配置

**固件不包含火山方舟 API Key**，首次启动后需通过配网页输入：

1. 刷写固件并上电
2. 手机连接设备热点（如 `ESP-AP-XXXX`，无密码）
3. 浏览器访问: `192.168.4.1`
4. 在"豆包 Agent 配置"区域输入：
   - **API Key**: 火山方舟控制台获取（UUID 格式，如 `xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx`）
   - **Model**: 留空则默认 `1.2.6.1` (Seed-1.2.6.1)
   - **Voice**: 留空则默认 `zh_female_vv_uranus_bigtts` (Vivi 2.0)
5. 点击"保存 Agent 配置"
6. 配置 WiFi 并连接

## 重新配网（保留 Key）

如需更换 WiFi 但保留已配置的 Agent Key：
- **按住 BOOT 键 2 秒** → 设备重启进入配网模式
- Key 已保存，无需重新输入
- 只需重新配置 WiFi 即可

## 按键功能

| 按键 | GPIO | 功能 |
|------|------|------|
| PTT | GPIO38 | 按住说话，松开停止 |
| SWITCH | GPIO21 | 短按切换 AI Agent（小智 / 豆包） |
| BOOT | GPIO0 | 按住 2 秒清除 WiFi 配置并重新配网（保留 Key） |

## 分区偏移

| 文件 | 偏移地址 |
|------|---------|
| bootloader.bin | 0x0 |
| partition-table.bin | 0x8000 |
| esp32s3_chatbot.bin | 0x10000 |

## 完整刷写（首次）

```bash
esptool.py --port COM4 --baud 921600 write_flash \
  0x0 bootloader.bin \
  0x8000 partition-table.bin \
  0x10000 esp32s3_chatbot.bin
```

## 仅更新 App（保留 NVS 配置）

```bash
esptool.py --port COM4 --baud 921600 write_flash 0x10000 esp32s3_chatbot.bin
```
FLASH_EOF

      - name: Upload flash instructions
        uses: actions/upload-artifact@v4
        with:
          name: flash-instructions
          path: build/FLASH_README.md
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          pattern: esp32s3_chatbot-firmware-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            esp32s3_chatbot.bin
            bootloader.bin
            partition-table.bin
            flash_args
            FLASH_README.md
          body: |
            ## ESP32-S3 Chatbot Firmware

            ### 首次配置

            **固件不包含 API Key**，首次启动后需通过配网页输入：

            1. 刷写固件并上电
            2. 手机连接设备热点（无密码）
            3. 浏览器访问 `192.168.4.1`
            4. 输入火山方舟 API Key（UUID 格式）并保存
            5. 配置 WiFi 并连接

            ### 按键功能

            - **PTT (GPIO38)**: 按住说话，松开停止
            - **SWITCH (GPIO21)**: 切换 AI Agent（小智 / 豆包）
            - **BOOT (GPIO0)**: 按住 2 秒清除 WiFi 配置并重新配网（保留 Key）

            ### 刷写命令

            ```bash
            esptool.py --port COM4 --baud 921600 write_flash \
              0x0 bootloader.bin \
              0x8000 partition-table.bin \
              0x10000 esp32s3_chatbot.bin

            # 仅更新 App（保留配置）
            esptool.py --port COM4 --baud 921600 write_flash 0x10000 esp32s3_chatbot.bin
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
