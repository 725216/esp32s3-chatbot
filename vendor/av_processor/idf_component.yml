dependencies:
  espressif/esp_audio_codec:
    public: true
    version: ^2.5.0
  espressif/esp_audio_effects:
    public: true
    version: ^1.3.0
  espressif/esp_audio_render:
    public: true
    version: ^0.8.0
  espressif/esp_audio_simple_player:
    public: true
    version: ^0.9.4
  espressif/esp_codec_dev:
    require: public
    version: ~1.5
  espressif/media_lib_sal:
    public: true
    version: ^0.9.0
  # LOCAL FIX (2026-10-28): audio_processor.c/h unconditionally reference the
  # esp-sr AFE/WakeNet API (recorder_setup_wn_config uses esp_srmodel_init/
  # esp_gmf_wn_init outside #if AV_PROCESSOR_SUPPORT_AFE), so gmf_ai_audio
  # (which pulls esp-sr headers/libs) must be restored for the build.
  espressif/gmf_ai_audio:
    public: true
    version: ^0.8.3
description: Audio/Video Processor module for ESP-GMF
documentation: https://github.com/espressif/esp-adf/blob/master/components/av_processor/README.md
issues: https://github.com/espressif/esp-adf/issues
tags:
- gmf
- multimedia
- agent
- av_processor
version: 0.6.6
